<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORROS CUENCA - Disenador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0b0d;color:#fff;font-family:'Poppins','Segoe UI',Arial,sans-serif}
button,input{font-family:inherit}
header{padding:14px 26px;background:linear-gradient(180deg,#141519,#101114);border-bottom:1px solid #2c2d33;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.brand{font-size:25px;font-weight:800;font-style:italic;letter-spacing:.3px;font-family:'Poppins',sans-serif}
.brand span{color:#e50914}
.tag{color:#9a9ba3;font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600;margin-top:2px}
.hcta{display:flex;align-items:center;gap:14px}
.phone{color:#c9cad0;font-size:13px;font-weight:500}
.cta{padding:12px 20px;background:linear-gradient(180deg,#d4121e,#a80d18);color:#fff;border:0;border-radius:11px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;letter-spacing:.3px;box-shadow:0 6px 16px -8px rgba(0,0,0,.75);transition:filter .15s,transform .15s}
.cta:hover{filter:brightness(1.1);transform:translateY(-1px)}
.layout{max-width:1320px;margin:auto;padding:18px;display:grid;grid-template-columns:1fr 400px;gap:14px}
.card{background:#16171b;border:1px solid #2c2d33;border-radius:16px;overflow:hidden}
.center{min-height:780px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#2b2e37,#07080b 80%);position:relative;padding:16px}
.matbadge{position:absolute;top:14px;left:14px;background:#0009;border:1px solid #333;border-radius:20px;padding:6px 12px;font-size:11px;color:#cfd0d5;backdrop-filter:blur(2px)}
.hint{margin-top:14px;padding:10px 16px;border:1px solid #2c2d33;border-radius:10px;color:#9a9ba3;font-size:12px;text-align:center;background:#101115cc}
.summary{margin:0;border-top:1px solid #26272d;background:#0e0f12;padding:12px 16px;color:#9a9ba3;font-size:11.5px;line-height:1.6;max-height:230px;overflow:auto}
.summary .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #24252b}
.summary .row:last-child{border-bottom:0}
.summary b{color:#fff}
.tabs{display:flex;flex-wrap:wrap}
.tab{flex:1;min-width:70px;padding:12px 3px;background:#101115;border:0;border-right:1px solid #26272d;border-bottom:1px solid #26272d;font-weight:800;font-size:11px;letter-spacing:.5px;color:#c7c8cd;cursor:pointer}
.tab.active{background:#e50914;color:#fff}
.tabscope{padding:8px 14px;font-size:10.5px;color:#6f7078;background:#101115;border-bottom:1px solid #26272d;letter-spacing:.5px}
.content{padding:16px}
.content b{font-size:12.5px;letter-spacing:.5px}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.color{height:50px;border:2px solid #444;border-radius:9px;cursor:pointer;position:relative}
.color.active{border-color:#fff;box-shadow:0 0 0 2px #e50914}
.color span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:9px;color:#9a9ba3}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{background:#202126;border:1px solid #383940;border-radius:9px;padding:11px;font-weight:700;font-size:12px;cursor:pointer;color:#fff}
.opt.active{border-color:#e50914;background:#321518}
.patterns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pat{height:76px;background:#202126;border:1px solid #3a3b42;border-radius:9px;cursor:pointer;color:#cfd0d5;font-size:11px;font-weight:700}
.pat.active{border:2px solid #e50914;color:#fff}
.sample{display:block;width:42px;height:26px;margin:0 auto 6px;background:#2a2b30;border-radius:3px}
.diamond{background-image:linear-gradient(45deg,transparent 45%,#aaa 46%,#aaa 54%,transparent 55%),linear-gradient(-45deg,transparent 45%,#aaa 46%,#aaa 54%,transparent 55%);background-size:16px 16px}
.hex{background-image:linear-gradient(30deg,transparent 45%,#aaa 46%,#aaa 52%,transparent 53%),linear-gradient(150deg,transparent 45%,#aaa 46%,#aaa 52%,transparent 53%);background-size:16px 16px}
.chevronp{background-image:repeating-linear-gradient(135deg,transparent 0 5px,#aaa 5px 6px),repeating-linear-gradient(45deg,transparent 0 5px,#aaa 5px 6px);background-size:14px 14px}
.dots{background-image:radial-gradient(#aaa 1.4px,transparent 1.4px);background-size:7px 7px}
.matopt{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px}
.matopt small{color:#9a9ba3;font-weight:500;font-size:11px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stitch{width:60px;height:42px;background:#17181c;border:1px solid #3a3b42;border-radius:8px;cursor:pointer;position:relative}
.stitch i{position:absolute;left:8px;right:8px;top:50%;display:block;border-top:3px dashed red}
.stitch.active{border-color:#e50914;box-shadow:0 0 0 2px #e50914 inset}
.txtbox{margin-top:10px}
.txtbox input{width:100%;padding:10px;border-radius:8px;border:1px solid #3a3b42;background:#101115;color:#fff;font-size:12px}
.zone{cursor:pointer;stroke:#111;stroke-width:3.5;stroke-dasharray:7 6;stroke-linecap:round;filter:drop-shadow(0px 1.2px 0.8px rgba(0,0,0,0.55));transition:stroke .2s,stroke-width .2s}
.zone.sel{stroke:#fff !important;stroke-width:6;stroke-dasharray:none;filter:drop-shadow(0px 2px 4px rgba(0,0,0,0.4))}
.seam{fill:none;stroke-width:2.2;stroke-dasharray:6 5;stroke-linecap:round;filter:drop-shadow(0px 1.2px 0.8px rgba(0,0,0,0.5));transition:stroke .2s}
.label{fill:#fff;font-weight:bold;font-size:15px;paint-order:stroke;stroke:#111;stroke-width:4;pointer-events:none}
.stage{width:min(600px,94%);height:auto;filter:drop-shadow(0 22px 25px rgba(0,0,0,.65))}
@media(max-width:1150px){.layout{grid-template-columns:250px 1fr}.right{grid-column:1/-1}}
@media(max-width:700px){.layout{grid-template-columns:1fr}.center{min-height:520px}}


.opt[disabled],.pat[disabled],.color[disabled]{opacity:.3;cursor:not-allowed;filter:grayscale(.75)}
.vetonote{grid-column:1/-1;color:#d3a0a0;font-size:11px;line-height:1.5;margin-top:10px;padding:9px 11px;border:1px solid #4a2b2b;border-radius:8px;background:#1d1315}
.pricebar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px;background:#101115;border-top:1px solid #26272d}
.pricebar .lbl{color:#a8a9b0;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.pricebar .val{color:#fff;font-size:23px;font-weight:800;letter-spacing:-.5px}
.pricebar .val small{font-size:12px;font-weight:600;color:#9a9ba3;letter-spacing:0}
.pricenote{padding:0 16px 12px;color:#6f7078;font-size:10.5px;line-height:1.5;background:#101115;border-bottom:1px solid #26272d}
.soon{font-size:9px;letter-spacing:.6px;opacity:.6;margin-left:5px}

body{padding-bottom:78px}
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 18px;background:#141519f2;backdrop-filter:blur(8px);border-top:1px solid #2c2d33}
.stickybar .sp{display:flex;flex-direction:column;gap:1px;min-width:0}
.stickybar .sl{color:#a8a9b0;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.stickybar .sv{color:#fff;font-size:19px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.stickybar .sv small{font-size:11.5px;font-weight:600;color:#9a9ba3}
.stickybar .cta{padding:12px 18px;font-size:13.5px;white-space:nowrap}
.presets{display:flex;gap:8px;overflow-x:auto;padding:11px 14px;background:#101115;border-bottom:1px solid #26272d}
.preset{flex:none;display:flex;align-items:center;gap:7px;padding:7px 11px;background:#202126;border:1px solid #383940;border-radius:20px;color:#e2e3e8;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.preset:hover{border-color:#5a5b63}
.preset .dots{display:flex;gap:3px}
.preset .dots i{width:11px;height:11px;border-radius:50%;border:1px solid #00000060}
.presetlbl{padding:11px 14px 0;background:#101115;color:#a8a9b0;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.modalbg{position:fixed;inset:0;z-index:90;background:#000000b8;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:100%;max-width:430px;background:#16171b;border:1px solid #3a3b42;border-radius:16px;padding:22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 5px;font-size:18px;font-weight:800;color:#fff}
.modal p.sub{margin:0 0 17px;color:#9a9ba3;font-size:12.5px;line-height:1.55}
.field{margin-bottom:13px}
.field label{display:block;color:#c7c8cd;font-size:11.5px;font-weight:700;letter-spacing:.5px;margin-bottom:5px}
.field label span{color:#9a9ba3;font-weight:500;letter-spacing:0}
.field input{width:100%;padding:11px;border-radius:9px;border:1px solid #3a3b42;background:#101115;color:#fff;font-size:14px}
.field input:focus{outline:2px solid #e50914;outline-offset:1px;border-color:#e50914}
.field input[aria-invalid="true"]{border-color:#e50914}
.field .err{color:#ff7b82;font-size:11.5px;margin-top:5px;display:none}
.field input[aria-invalid="true"] ~ .err{display:block}
.modalact{display:flex;gap:9px;margin-top:18px}
.modalact button{flex:1;padding:13px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;border:0}
.btnghost{background:#202126;color:#c7c8cd;border:1px solid #3a3b42 !important}
.restore{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 18px;background:#16202a;border-bottom:1px solid #24384a;color:#bcd4e8;font-size:12px}
.restore button{background:none;border:0;color:#7fb4e8;font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit}
@media(max-width:700px){.stickybar .sv{font-size:17px}.stickybar .cta{padding:11px 14px;font-size:12.5px}}
#fx{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
<body>

<!-- Paint servers compartidos. NUNCA display:none: en Blink un gradiente o
     patron dentro de display:none no resuelve y las zonas salen planas. -->
<svg id="fx" aria-hidden="true"><defs>
        <pattern id="pDiamond" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M0 10L10 0L20 10L10 20Z" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.3"/>
        </pattern>
        <pattern id="pHex" width="22" height="19" patternUnits="userSpaceOnUse">
          <path d="M5.5 0L16.5 0L22 9.5L16.5 19L5.5 19L0 9.5Z" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.2"/>
        </pattern>
        <pattern id="pChevron" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M0 8L8 0L16 8L8 16Z" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.3"/>
        </pattern>
        <pattern id="pDots" width="9" height="9" patternUnits="userSpaceOnUse">
          <circle cx="4.5" cy="4.5" r="1.3" fill="#fff" fill-opacity=".28"/>
        </pattern>
        
        <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="noise"/>
          <feColorMatrix type="matrix" values="
            0.5 0 0 0 0.2
            0.5 0 0 0 0.2
            0.5 0 0 0 0.2
            0.4 0 0 0 0.14" result="grainNoise"/>
        </filter>

        <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="10" />
        </filter>

        <!-- Chrome metallic gradient for headrest rods -->
        <linearGradient id="chrome-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3a3c42" />
          <stop offset="25%" stop-color="#b0b3ba" />
          <stop offset="45%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#d0d3da" />
          <stop offset="85%" stop-color="#70737a" />
          <stop offset="100%" stop-color="#3a3c42" />
        </linearGradient>

        <!-- Glow filter for specular rim lighting -->
        <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3.5" />
        </filter>

        <!-- Background studio spotlight glow -->
        <radialGradient id="bg-spotlight" cx="50%" cy="0%" r="65%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
          <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>

        <!-- Volumetric light beam overlay -->
        <linearGradient id="volumetric-light" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <!-- Deep 3D joint crease shadow gradients -->
        <linearGradient id="joint-shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.95" />
          <stop offset="35%" stop-color="#000000" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="joint-shadow-up" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </linearGradient>

        <!-- Shading gradients to give volume (intensified highlights) -->
        <linearGradient id="head-shading" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
          <stop offset="30%" stop-color="#ffffff" stop-opacity="0.18"/>
          <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
        </linearGradient>

        <linearGradient id="back-shading-vert" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
          <stop offset="15%" stop-color="#000000" stop-opacity="0.15"/>
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0.26"/>
          <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
        </linearGradient>

        <linearGradient id="back-shading-horiz" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
          <stop offset="15%" stop-color="#000000" stop-opacity="0.0"/>
          <stop offset="85%" stop-color="#000000" stop-opacity="0.0"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
        </linearGradient>

        <linearGradient id="side-shading-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
          <stop offset="25%" stop-color="#ffffff" stop-opacity="0.38"/>
          <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
        </linearGradient>

        <linearGradient id="sideR-shading-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
          <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
          <stop offset="75%" stop-color="#ffffff" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
        </linearGradient>

        <linearGradient id="base-shading-vert" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
          <stop offset="25%" stop-color="#000000" stop-opacity="0.2"/>
          <stop offset="65%" stop-color="#ffffff" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
        </linearGradient>

        <linearGradient id="base-shading-horiz" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
          <stop offset="15%" stop-color="#000000" stop-opacity="0.0"/>
          <stop offset="85%" stop-color="#000000" stop-opacity="0.0"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
        </linearGradient>

        <linearGradient id="edge-shading-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
          <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15"/>
          <stop offset="70%" stop-color="#000000" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
        </linearGradient>
      </defs></svg>

<script>
/* ============================================================
   F0 — Fundacion:  un producto = una entrada en PRODUCTS.
   F2 — Catalogo como datos: colores, patrones, materiales,
        reglas de incompatibilidad y precios "desde".
   Los <defs> viven en #fx, que NUNCA lleva display:none:
   en Blink un paint server dentro de display:none no resuelve.
   ============================================================ */

const NEGOCIO = { tel:'0984353695', wa:'593984353695', ig:'FORROSCUENCA' };

/* --- CATALOGO. Los 14 colores que realmente maneja el taller. --- */
const COLORS=[
  ['Negro','#111214'],['Gris','#85878a'],['Plateado','#adb2b8'],['Blanco','#e9e9e6'],
  ['Beige','#cdbb9b'],['Cafe','#70462e'],['Chocolate','#3d2418'],['Vino','#641c2a'],
  ['Rojo','#c71d28'],['Naranja','#d86b1c'],['Verde','#145a42'],
  ['Azul','#164f9d'],['Marino','#162b4a'],['Turquesa','#1594a6']
];

/* Solo los patrones que el taller hace de verdad. */
const PATTERNS={
  Liso:   {svg:null,      cls:''},
  Rombos: {svg:'pDiamond',cls:'diamond'},
  Puntos: {svg:'pDots',   cls:'dots'}
};

const STITCHES=[['Roja','#e50914'],['Blanca','#fff'],['Negra','#111'],['Azul','#2776db'],['Beige','#d7b986'],['Turquesa','#1594a6'],['Gris','#9a9ba0']];

const MATERIALS=[
  {name:'Cuero Americano', desc:'Importado, acabado suave y uniforme, alto brillo y gran durabilidad.'},
  {name:'Cuero Colombiano',desc:'Cuero nacional de textura firme y grano marcado, excelente relacion calidad-precio.'},
  {name:'Tela',            desc:'Tela automotriz resistente, la opcion mas economica y fresca.'}
];

const EMB=[
  {t:'Sin bordado',        precio:0},
  {t:'FORROS CUENCA',      precio:5, tam:'grande'},
  {t:'Nombre del cliente', precio:2, tam:'pequeno', pideTexto:true},
  {t:'Logo personalizado', precio:5, tam:'grande',  pideTexto:true}
];

/* ############################################################
   #                                                          #
   #   PRECIOS  —  ESTA ES LA UNICA PARTE QUE TU EDITAS.      #
   #                                                          #
   #   Cambia los numeros de abajo y guarda el archivo.        #
   #   No toques nada mas: ni las comas, ni las comillas.      #
   #                                                          #
   #   'desde' = el precio MAS BARATO al que haces ese         #
   #   producto. Es el que ve el cliente como "Desde $X".      #
   #   Pon  null  (sin comillas) si prefieres no publicarlo:   #
   #   la app dira "Precio a medida" en vez de inventar.       #
   #                                                          #
   ############################################################ */
const PRECIOS = {
  moneda: '$',

  desde: {
    auto:       110,   // <-- forro de asiento de auto
    moto:        45,   // <-- forro de asiento de moto
    camioneta:  180,   // <-- juego de camioneta / SUV
    tablero:     80,   // <-- forro de tablero
    techo:       70,   // <-- forro de techo (cielo raso)
    pisos:       50    // <-- juego de pisos / alfombras
  },

  // Cuanto SUMA cada material sobre el precio de arriba.
  recargoMaterial: {
    'Cuero Americano':  100,
    'Cuero Colombiano':   0,
    'Tela':               0
  },

  // El texto chico que aparece debajo del precio.
  nota: 'Precio referencial desde. Incluye instalacion. No cobramos IVA (somos artesanos). Entrega en 1 a 2 dias.'
};

/* ============================================================
   CATALOGO DE PRODUCTOS. Agregar uno = una entrada aqui + su svg.
   pending:true  -> declarado pero sin geometria todavia (F1).
   ============================================================ */
const PRODUCTS = {
  auto: {
    id:'auto', label:'Auto', wa:'forro de asiento de auto',
    parts:[
      {key:'back', label:'Frontal respaldo', num:1, rol:'centro',  zones:['back'],         labelAt:{x:310,y:300}},
      {key:'side', label:'Laterales',        num:2, rol:'lateral', zones:['side','sideR'], labelAt:{x:185,y:300}},
      {key:'base', label:'Centro base',      num:3, rol:'centro',  zones:['base'],         labelAt:{x:310,y:550}},
      {key:'head', label:'Cabecera',         num:4, rol:'lateral', zones:['head'],         labelAt:{x:310,y:120}},
      {key:'edge', label:'Bordes base',      num:5, rol:'lateral', zones:['edge'],         labelAt:{x:455,y:600}}
    ]
  },
  moto: {
    id:'moto', label:'Moto', wa:'forro de asiento de moto',
    parts:[
      {key:'piloto',   label:'Asiento piloto',   num:1, rol:'centro',  zones:['piloto'],          labelAt:{x:310,y:530}},
      {key:'copiloto', label:'Asiento copiloto', num:2, rol:'centro',  zones:['copiloto'],        labelAt:{x:310,y:240}},
      {key:'sides',    label:'Laterales',        num:3, rol:'lateral', zones:['sidesL','sidesR'], labelAt:{x:180,y:520}},
      {key:'ridge',    label:'Borde / Acento',   num:4, rol:'lateral', zones:['ridge'],           labelAt:{x:310,y:338}}
    ]
  },
  camioneta: { id:'camioneta', label:'Camioneta / SUV', wa:'juego de forros de camioneta', pending:true,
    parts:[
      {key:'back', label:'Frontal respaldo', num:1, rol:'centro', zones:['back']},
      {key:'side', label:'Laterales',        num:2, rol:'lateral', zones:['side','sideR']},
      {key:'base', label:'Centro base',      num:3, rol:'centro', zones:['base']},
      {key:'head', label:'Cabecera',         num:4, rol:'lateral', zones:['head']},
      {key:'banca',label:'Banca trasera',    num:5, rol:'centro', zones:['banca']}
    ]
  },
  tablero: { id:'tablero', label:'Tablero', wa:'forro de tablero', pending:true,
    parts:[ {key:'pieza', label:'Tablero', num:1, rol:'centro', zones:['pieza']} ] },
  techo:   { id:'techo',   label:'Techo',   wa:'forro de techo (cielo raso)', pending:true,
    parts:[ {key:'pieza', label:'Techo', num:1, rol:'centro', zones:['pieza']} ] },
  pisos:   { id:'pisos',   label:'Pisos',   wa:'juego de pisos', pending:true,
    parts:[ {key:'pieza', label:'Alfombra', num:1, rol:'centro', zones:['pieza']} ] }
};

/* ============================================================
   REGLAS DE INCOMPATIBILIDAD — datos, no ifs anidados.
   Cada veto lleva su motivo, y el motivo se le muestra al cliente.
   ============================================================ */
const INCOMPATIBLES = [
  { producto:'pisos', dim:'pattern', valor:'Puntos',
    motivo:'El perforado no se usa en pisos: deja pasar el agua y la tierra.' }
];

const SVGNS='http://www.w3.org/2000/svg';
const el = (prod, suffix) => document.getElementById(prod+'__'+suffix);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colorHex  = n => (COLORS.find(c=>c[0]===n)||[])[1]||'#111';
const stitchHex = n => (STITCHES.find(s=>s[0]===n)||[])[1]||'#e50914';
const embDef    = t => EMB.find(e=>e.t===t) || EMB[0];
const buildable = () => Object.values(PRODUCTS).filter(p=>!p.pending);

/* --- vetos vigentes para el producto activo, por dimension --- */
function vetos(dim){
  const m = new Map();
  INCOMPATIBLES.forEach(r=>{
    if(r.dim===dim && r.producto===productId) m.set(r.valor, r.motivo);
  });
  return m;
}

/* --- estado anidado por producto, DERIVADO del catalogo --- */
const state = Object.fromEntries(Object.entries(PRODUCTS).map(([id,prod])=>[
  id, Object.fromEntries(prod.parts.map(x=>[x.key,{color:'Negro',pattern:'Liso',stitch:'Roja'}]))
]));

let productId = 'auto';
let activePart = PRODUCTS.auto.parts[0].key;
let tab = 'color';
/* El material por defecto es SIEMPRE el de menor recargo, derivado de la tabla:
   asi el precio que se ve al abrir coincide siempre con el 'desde' que se anuncia. */
let material = MATERIALS.slice().sort((a,b)=>
  (PRECIOS.recargoMaterial[a.name]||0) - (PRECIOS.recargoMaterial[b.name]||0))[0].name;
let embroidery = { type:'Sin bordado', text:'' };

const content  = document.getElementById('content');
const tabscope = document.getElementById('tabscope');

/* --- repara elecciones que quedaron vetadas al cambiar de producto --- */
function repararConflictos(){
  const reparados = [];
  ['pattern','color','stitch'].forEach(dim=>{
    const v = vetos(dim);
    if(!v.size) return;
    const fallback = dim==='pattern' ? 'Liso' : (dim==='color' ? 'Negro' : 'Roja');
    PRODUCTS[productId].parts.forEach(part=>{
      const s = state[productId][part.key];
      if(v.has(s[dim])){ reparados.push(`${part.label}: ${s[dim]} -> ${fallback}`); s[dim]=fallback; }
    });
  });
  return reparados;
}

function mountVehicleBar(){
  const bar = document.getElementById('vehiclebar');
  bar.innerHTML = Object.values(PRODUCTS).map(p=>
    `<button class="opt" data-prod="${esc(p.id)}"${p.pending?' disabled title="Estamos dibujando este producto"':''} style="padding:6px 16px;font-size:12px;border-radius:20px">${esc(p.label)}${p.pending?'<span class="soon">pronto</span>':''}</button>`
  ).join('');
  bar.addEventListener('click', e=>{
    const b = e.target.closest('[data-prod]');
    if(b && !b.disabled) setProduct(b.dataset.prod);
  });
}

function mountLabels(){
  buildable().forEach(prod=>{
    const g = el(prod.id,'labels');
    if(!g) return;
    g.replaceChildren(...prod.parts.map(part=>{
      const t = document.createElementNS(SVGNS,'text');
      t.setAttribute('class','label');
      t.setAttribute('x', part.labelAt.x);
      t.setAttribute('y', part.labelAt.y);
      t.textContent = part.num;
      return t;
    }));
  });
}

function mountZoneHandlers(){
  buildable().forEach(prod=>prod.parts.forEach(part=>part.zones.forEach(z=>{
    const zn = el(prod.id, z);
    if(zn) zn.addEventListener('click', ()=>{ activePart = part.key; render(); paint(); });
  })));
}

function setProduct(id){
  const prod = PRODUCTS[id];
  if(!prod || prod.pending) return;
  productId = id;
  Object.values(PRODUCTS).forEach(p=>{
    const svg = document.getElementById('svg-'+p.id);
    if(svg) svg.style.display = (p.id===id ? 'block' : 'none');
  });
  document.querySelectorAll('#vehiclebar [data-prod]')
    .forEach(b=>b.classList.toggle('active', b.dataset.prod===id));
  if(!prod.parts.some(p=>p.key===activePart)) activePart = prod.parts[0].key;
  repararConflictos();
  render(); paint(); paintMaterial(); paintEmbroidery();
}

function currentPart(){
  const parts = PRODUCTS[productId].parts;
  let part = parts.find(p=>p.key===activePart);
  if(!part){ part = parts[0]; activePart = part.key; }
  return part;
}

/* --- precio "desde": base del producto + recargos conocidos --- */
function precioDesde(){
  const base = PRECIOS.desde[productId];
  if(base==null) return null;
  return base + (PRECIOS.recargoMaterial[material]||0) + embDef(embroidery.type).precio;
}

function renderPrice(){
  const v = precioDesde();
  const valEl = document.getElementById('priceVal');
  const noteEl = document.getElementById('priceNote');
  if(v==null){
    valEl.innerHTML = '<small>Cotizamos tu caso por WhatsApp</small>';
    noteEl.textContent = 'Todavia no publicamos precio de referencia para este producto.';
    return;
  }
  const extras = [];
  const rm = PRECIOS.recargoMaterial[material]||0;
  if(rm) extras.push(`${material} +${PRECIOS.moneda}${rm}`);
  const re = embDef(embroidery.type).precio;
  if(re) extras.push(`bordado +${PRECIOS.moneda}${re}`);
  valEl.innerHTML = `${PRECIOS.moneda}${v}` + (extras.length?` <small>(${extras.map(esc).join(' &middot; ')})</small>`:'');
  noteEl.textContent = PRECIOS.nota;
}

function render(){
  const part = currentPart();
  const s = state[productId][part.key];
  let h = '';
  if(tab==='color'){
    tabscope.textContent = `Editando color de: ${part.label}`;
    const v = vetos('color');
    h = '<b>COLOR DE LA PARTE SELECCIONADA</b><div class="colors">' + COLORS.map(c=>{
      const bad = v.get(c[0]);
      return `<button class="color ${s.color===c[0]?'active':''}" style="background:${c[1]}" title="${esc(bad||c[0])}" ${bad?'disabled':''} data-act="color" data-val="${esc(c[0])}"></button>`;
    }).join('') + '</div>';
  }
  if(tab==='pattern'){
    tabscope.textContent = `Editando patron de: ${part.label}`;
    const v = vetos('pattern');
    h = '<b>TIPO DE PATRON</b><div class="patterns">' + Object.keys(PATTERNS).map(k=>{
      const bad = v.get(k);
      return `<button class="pat ${s.pattern===k?'active':''}" ${bad?'disabled':''} title="${esc(bad||k)}" data-act="pattern" data-val="${esc(k)}"><span class="sample ${PATTERNS[k].cls}"></span>${esc(k)}</button>`;
    }).join('');
    const motivos = [...v.values()];
    if(motivos.length) h += `<div class="vetonote">${esc(motivos.join(' '))}</div>`;
    h += '</div>';
  }
  if(tab==='stitch'){
    tabscope.textContent = `Editando costura de: ${part.label}`;
    h = '<b>COLOR DE COSTURA</b><div class="swatches">' + STITCHES.map(x=>
      `<button class="stitch ${s.stitch===x[0]?'active':''}" title="${esc(x[0])}" data-act="stitch" data-val="${esc(x[0])}"><i style="border-color:${x[1]}"></i></button>`).join('') + '</div>';
  }
  if(tab==='material'){
    tabscope.textContent = 'Aplica a todo el producto';
    h = '<b>MATERIAL</b><div class="options">' + MATERIALS.map(m=>{
      const r = PRECIOS.recargoMaterial[m.name]||0;
      const tag = r ? ` (+${PRECIOS.moneda}${r})` : '';
      return `<button class="opt matopt ${material===m.name?'active':''}" data-act="material" data-val="${esc(m.name)}">${esc(m.name)}${tag}<small>${esc(m.desc)}</small></button>`;
    }).join('') + '</div>';
  }
  if(tab==='embroidery'){
    tabscope.textContent = 'Aplica a todo el producto';
    h = '<b>BORDADO</b><div class="options">' + EMB.map(e=>{
      const tag = e.precio ? ` (+${PRECIOS.moneda}${e.precio})` : '';
      return `<button class="opt ${embroidery.type===e.t?'active':''}" data-act="emb" data-val="${esc(e.t)}">${esc(e.t)}${tag}</button>`;
    }).join('') + '</div>';
    if(embDef(embroidery.type).pideTexto){
      const ph = embroidery.type==='Nombre del cliente' ? 'Escribe el nombre...' : 'Describe el logo/texto...';
      h += `<div class="txtbox"><input id="embInput" placeholder="${esc(ph)}"></div>`;
    }
  }
  content.innerHTML = h;
  const inp = document.getElementById('embInput');
  if(inp) inp.value = embroidery.text;
  renderSummary();
  renderPrice();
  renderSticky();
}

function setPart(field,value){
  if(vetos(field).has(value)) return;
  state[productId][activePart][field]=value; render(); paint(); guardar();
}
function setMaterial(m){ material=m; render(); paintMaterial(); guardar(); }
function setEmbroidery(t){
  embroidery.type=t;
  if(!embDef(t).pideTexto) embroidery.text='';
  render(); paintEmbroidery(); guardar();
}

function paint(){
  PRODUCTS[productId].parts.forEach(part=>{
    const s = state[productId][part.key];
    const pd = PATTERNS[s.pattern] || PATTERNS.Liso;
    part.zones.forEach(z=>{
      const zn = el(productId, z);
      if(!zn) return;
      zn.setAttribute('fill', colorHex(s.color));
      const ov = el(productId, z+'-pat');
      if(ov) ov.setAttribute('fill', pd.svg ? `url(#${pd.svg})` : 'none');
      const sel = part.key===activePart;
      zn.classList.toggle('sel', sel);
      zn.style.stroke = sel ? '' : stitchHex(s.stitch);
    });
    const seam = el(productId, 'seams-'+part.key);
    if(seam) seam.style.stroke = stitchHex(s.stitch);
  });
}

function paintMaterial(){
  Object.values(PRODUCTS).forEach(p=>{
    const g = el(p.id,'grain');
    if(!g) return;
    const op = p.id!==productId ? '0'
      : (material==='Tela' ? '.62' : (material==='Cuero Colombiano' ? '.48' : '.12'));
    g.setAttribute('opacity', op);
  });
  document.getElementById('matBadge').textContent = material;
  renderPrice();
}

function paintEmbroidery(){
  const txt = embroidery.type==='Sin bordado' ? ''
    : (embroidery.type==='FORROS CUENCA' ? 'FORROS CUENCA'
      : (embroidery.text || (embroidery.type==='Nombre del cliente' ? 'Tu nombre aqui' : 'Tu logo aqui')));
  Object.values(PRODUCTS).forEach(p=>{
    const t = el(p.id,'emb');
    if(!t) return;
    const on = (p.id===productId && txt);
    t.textContent = on ? txt : '';
    t.setAttribute('opacity', on ? '.9' : '0');
  });
  renderPrice();
}

function renderSummary(){
  const rows = PRODUCTS[productId].parts.map(part=>{
    const s = state[productId][part.key];
    return `<div class="row"><span>${esc(part.label)}</span><b>${esc(s.color)} &middot; ${esc(s.pattern)} &middot; ${esc(s.stitch)}</b></div>`;
  }).join('');
  document.getElementById('summary').innerHTML = rows +
    `<div class="row"><span>Material</span><b>${esc(material)}</b></div>` +
    `<div class="row"><span>Bordado</span><b>${esc(embroidery.type)}${embroidery.text?' - '+esc(embroidery.text):''}</b></div>`;
}



/* ============================================================
   F3 — Conversion. Presets, persistencia, diseno compartible,
   formulario del vehiculo y mensaje de WhatsApp util.
   ============================================================ */

/* Presets por ROL, no por producto: sirven para los 6 sin tocarlos. */
const PRESETS = [
  {name:'Full Negro',      centro:{color:'Negro',  pattern:'Liso',  stitch:'Roja'},   lateral:{color:'Negro', pattern:'Liso', stitch:'Roja'}},
  {name:'Deportivo Rojo',  centro:{color:'Rojo',   pattern:'Rombos',stitch:'Negra'},  lateral:{color:'Negro', pattern:'Liso', stitch:'Roja'}},
  {name:'Elegante Beige',  centro:{color:'Beige',  pattern:'Rombos',stitch:'Beige'},  lateral:{color:'Cafe',  pattern:'Liso', stitch:'Beige'}},
  {name:'Bicolor Marino',  centro:{color:'Marino', pattern:'Rombos',stitch:'Blanca'}, lateral:{color:'Gris',  pattern:'Liso', stitch:'Blanca'}},
  {name:'Vino Clasico',    centro:{color:'Vino',   pattern:'Rombos',stitch:'Beige'},  lateral:{color:'Negro', pattern:'Liso', stitch:'Beige'}}
];

let cliente = { nombre:'', vehiculo:'', ciudad:'' };

function aplicarPreset(i){
  const p = PRESETS[i]; if(!p) return;
  const vC = vetos('color'), vP = vetos('pattern');
  PRODUCTS[productId].parts.forEach(part=>{
    const src = p[part.rol] || p.centro;
    const s = state[productId][part.key];
    if(!vC.has(src.color))   s.color   = src.color;
    if(!vP.has(src.pattern)) s.pattern = src.pattern;
    s.stitch = src.stitch;
  });
  render(); paint(); guardar();
}

function mountPresets(){
  const c = document.getElementById('presets');
  c.innerHTML = PRESETS.map((p,i)=>
    `<button class="preset" data-preset="${i}"><span class="dots">`+
    `<i style="background:${colorHex(p.centro.color)}"></i>`+
    `<i style="background:${colorHex(p.lateral.color)}"></i>`+
    `<i style="background:${stitchHex(p.centro.stitch)}"></i>`+
    `</span>${esc(p.name)}</button>`).join('');
  c.addEventListener('click', e=>{
    const b = e.target.closest('[data-preset]');
    if(b) aplicarPreset(+b.dataset.preset);
  });
}

/* ---------- diseno compartible en la URL ---------- */
const A64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const idxColor  = n => Math.max(0, COLORS.findIndex(c=>c[0]===n));
const idxPat    = n => Math.max(0, Object.keys(PATTERNS).indexOf(n));
const idxStitch = n => Math.max(0, STITCHES.findIndex(s=>s[0]===n));

function codificar(){
  const prods = Object.keys(PRODUCTS);
  const nums = [prods.indexOf(productId)];
  PRODUCTS[productId].parts.forEach(part=>{
    const s = state[productId][part.key];
    nums.push(idxColor(s.color), idxPat(s.pattern), idxStitch(s.stitch));
  });
  nums.push(Math.max(0, MATERIALS.findIndex(m=>m.name===material)));
  nums.push(Math.max(0, EMB.findIndex(e=>e.t===embroidery.type)));
  const chk = nums.reduce((a,b)=>(a+b)%64, 7);
  let out = nums.concat([chk]).map(n=>A64[n%64]).join('');
  if(embroidery.text) out += '~' + encodeURIComponent(embroidery.text.slice(0,40));
  return out;
}

function decodificar(str){
  try{
    if(!str) return false;
    const [codeRaw, txt] = str.split('~');
    const nums = [...codeRaw].map(ch=>A64.indexOf(ch));
    if(nums.some(n=>n<0) || nums.length < 5) return false;
    const chk = nums.pop();
    if(nums.reduce((a,b)=>(a+b)%64, 7) !== chk) return false;
    const prods = Object.keys(PRODUCTS);
    const prod = PRODUCTS[prods[nums[0]]];
    if(!prod || prod.pending) return false;
    if(nums.length !== 1 + prod.parts.length*3 + 2) return false;
    let i = 1;
    prod.parts.forEach(part=>{
      const s = state[prod.id][part.key];
      s.color   = (COLORS[nums[i++]]||COLORS[0])[0];
      s.pattern = Object.keys(PATTERNS)[nums[i++]] || 'Liso';
      s.stitch  = (STITCHES[nums[i++]]||STITCHES[0])[0];
    });
    material = (MATERIALS[nums[i++]]||MATERIALS[0]).name;
    embroidery.type = (EMB[nums[i++]]||EMB[0]).t;
    embroidery.text = txt ? decodeURIComponent(txt) : '';
    productId = prod.id;
    return true;
  }catch(e){ return false; }
}

function enlaceDiseno(){
  return location.origin + location.pathname + '?d=' + codificar();
}

/* ---------- persistencia ---------- */
const LS = 'forroscuenca.v1';
function guardar(){
  try{
    localStorage.setItem(LS, JSON.stringify({productId, state, material, embroidery, cliente}));
  }catch(e){}
}
function restaurar(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !PRODUCTS[d.productId] || PRODUCTS[d.productId].pending) return false;
    Object.entries(d.state||{}).forEach(([pid, parts])=>{
      if(!state[pid]) return;
      Object.entries(parts).forEach(([k,v])=>{ if(state[pid][k]) Object.assign(state[pid][k], v); });
    });
    if(MATERIALS.some(m=>m.name===d.material)) material = d.material;
    if(d.embroidery && EMB.some(e=>e.t===d.embroidery.type)) embroidery = d.embroidery;
    if(d.cliente) cliente = Object.assign(cliente, d.cliente);
    productId = d.productId;
    return true;
  }catch(e){ return false; }
}
function olvidar(){ try{ localStorage.removeItem(LS); }catch(e){} }

/* ---------- barra fija ---------- */
function renderSticky(){
  const v = precioDesde();
  document.getElementById('stickyLbl').textContent = PRODUCTS[productId].label;
  document.getElementById('stickyVal').innerHTML = v==null
    ? '<small>Precio a medida</small>'
    : `Desde ${PRECIOS.moneda}${v}`;
}

/* ---------- formulario del vehiculo ---------- */
function abrirFormulario(){
  const bg = document.createElement('div');
  bg.className = 'modalbg';
  bg.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTit">
      <h3 id="mTit">Un dato m&aacute;s y te cotizamos</h3>
      <p class="sub">El precio depende del veh&iacute;culo. Con esto te damos el valor exacto en el primer mensaje, sin ida y vuelta.</p>
      <div class="field">
        <label for="fVeh">Marca, modelo y a&ntilde;o</label>
        <input id="fVeh" placeholder="Ej: Chevrolet Aveo 2015" autocomplete="off">
        <div class="err">Escribe al menos la marca y el modelo.</div>
      </div>
      <div class="field">
        <label for="fNom">Tu nombre</label>
        <input id="fNom" placeholder="Ej: Jairo M&eacute;ndez" autocomplete="name">
        <div class="err">Dinos c&oacute;mo te llamas.</div>
      </div>
      <div class="field">
        <label for="fCiu">Ciudad <span>(opcional)</span></label>
        <input id="fCiu" placeholder="Cuenca" autocomplete="address-level2">
      </div>
      <div class="modalact">
        <button class="btnghost" id="mCancel">Volver</button>
        <button class="cta" id="mSend">Enviar por WhatsApp</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const veh = bg.querySelector('#fVeh'), nom = bg.querySelector('#fNom'), ciu = bg.querySelector('#fCiu');
  veh.value = cliente.vehiculo; nom.value = cliente.nombre; ciu.value = cliente.ciudad;
  veh.focus();

  const cerrar = ()=>{ bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e=>{ if(e.key==='Escape') cerrar(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('click', e=>{ if(e.target===bg) cerrar(); });
  bg.querySelector('#mCancel').addEventListener('click', cerrar);

  const validar = ()=>{
    let ok = true;
    if(veh.value.trim().length < 3){ veh.setAttribute('aria-invalid','true'); ok=false; } else veh.removeAttribute('aria-invalid');
    if(nom.value.trim().length < 2){ nom.setAttribute('aria-invalid','true'); ok=false; } else nom.removeAttribute('aria-invalid');
    return ok;
  };
  [veh,nom].forEach(i=>i.addEventListener('input',()=>i.removeAttribute('aria-invalid')));
  bg.querySelector('#mSend').addEventListener('click', ()=>{
    if(!validar()){ bg.querySelector('[aria-invalid="true"]').focus(); return; }
    cliente = { nombre:nom.value.trim(), vehiculo:veh.value.trim(), ciudad:ciu.value.trim() };
    guardar(); cerrar(); enviarWhatsApp();
  });
}

function folio(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  const seq = codificar().replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();
  return `FC-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${seq}`;
}

function enviarWhatsApp(){
  const prod = PRODUCTS[productId];
  const lineas = prod.parts.map(part=>{
    const s = state[productId][part.key];
    return `- ${part.label}: ${s.color}, ${s.pattern}, costura ${s.stitch}`;
  }).join('\n');
  const v = precioDesde();
  const m =
`Hola Forros Cuenca! Quiero cotizar un ${prod.wa}.

Cotizacion ${folio()}
Cliente: ${cliente.nombre}
Vehiculo: ${cliente.vehiculo}${cliente.ciudad?'\nCiudad: '+cliente.ciudad:''}

Diseno:
${lineas}
Material: ${material}
Bordado: ${embroidery.type}${embroidery.text?' - '+embroidery.text:''}
${v!=null?`Referencia web: desde ${PRECIOS.moneda}${v}`:''}

Ver mi diseno: ${enlaceDiseno()}`;
  const url = 'https://wa.me/'+NEGOCIO.wa+'?text='+encodeURIComponent(m);
  /* window.open falla en el navegador interno de Instagram/Facebook */
  const w = window.open(url,'_blank');
  if(!w || w.closed || typeof w.closed==='undefined') location.href = url;
}

function send(){ abrirFormulario(); }

content.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.val;
  if(a==='color'||a==='pattern'||a==='stitch') setPart(a,v);
  else if(a==='material') setMaterial(v);
  else if(a==='emb') setEmbroidery(v);
});
content.addEventListener('input', e=>{
  if(e.target.id==='embInput'){ embroidery.text = e.target.value; renderSummary(); paintEmbroidery(); }
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  tab = b.dataset.t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  render();
}));
document.getElementById('ctaWa').addEventListener('click', send);

document.getElementById('ctaSticky').addEventListener('click', send);
document.getElementById('restoreReset').addEventListener('click', ()=>{
  olvidar(); location.href = location.origin + location.pathname;
});

mountVehicleBar();
mountLabels();
mountZoneHandlers();
mountPresets();

/* Prioridad: un diseno compartido por link gana sobre lo guardado. */
const compartido = decodificar(new URLSearchParams(location.search).get('d'));
const recuperado = !compartido && restaurar();
if(recuperado) document.getElementById('restoreBar').style.display = 'flex';

setProduct(productId);
</script>
